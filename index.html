<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASOS Security Verification</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .box {
        width: 92%;
        max-width: 500px;
        background: white;
        padding: 35px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .logo {
        font-size: 42px;
        font-weight: 900;
        letter-spacing: -3px;
        margin-bottom: 30px;
    }

    h1 {
        font-size: 23px;
        margin-bottom: 15px;
    }

    p {
        color: #555;
        line-height: 1.5;
    }

    button {
        margin-top: 15px;
        padding: 15px 25px;
        border: none;
        background: #018849;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #016f3b;
    }

    #prank {
        display: none;
        margin-top: 25px;
    }

    iframe {
        width: 100%;
        aspect-ratio: 16/9;
        border: none;
    }

    .rickroll {
        font-size: 28px;
        font-weight: bold;
        margin-top: 20px;
    }
</style>
</head>

<body>

<div class="box">

    <div class="logo">ASOS</div>

    <h1>Security verification required</h1>

    <p>
        We've detected unusual activity associated with your account.
    </p>

    <p>
        Please complete the security verification below to confirm
        that you are the account owner.
    </p>

    <button onclick="verify()">
        Complete security verification
    </button>

    <div id="prank">

        <iframe
            src=""
            id="video"
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>

        <div class="rickroll">
            😂 YOU'VE BEEN RICKROLLED 😂
        </div>

    </div>

</div>

<script>
function verify() {

    document.querySelector("button").style.display = "none";

    document.getElementById("prank").style.display = "block";

    document.getElementById("video").src =
        "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1";

}
</script>

</body>
</html>
